name: Build Windows & Linux Standalone Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload assets to"
        required: false
        default: "v1.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies & generate icon
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 requests qrcode pillow numpy pyinstaller
          python packaging/app/make_icon.py packaging/app brand
      - name: Build BiliFetch.exe with PyInstaller
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',open('bilifetch.py',encoding='utf-8').read()).group(1))")
          pyinstaller --noconfirm --onedir --windowed \
            --name BiliFetch \
            --icon packaging/app/icon.ico \
            --add-data "packaging/app/icon.ico;." \
            --exclude-module numpy --exclude-module cryptography \
            --exclude-module matplotlib --exclude-module pandas --exclude-module scipy \
            bilifetch_gui.py
          # Bundle ffmpeg.exe if available on runner
          FFMPEG_PATH=$(which ffmpeg || true)
          if [ -n "$FFMPEG_PATH" ] && [ -f "$FFMPEG_PATH" ]; then
            cp "$FFMPEG_PATH" dist/BiliFetch/ffmpeg.exe
          fi
          cp README.md LICENSE dist/BiliFetch/
          cd dist
          7z a -tzip "BiliFetch-${VERSION}-Windows-x64.zip" BiliFetch
      - name: Upload Windows x64 Standalone Zip to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "BiliFetch $TAG" --generate-notes
            gh release upload "$TAG" dist/BiliFetch-*-Windows-x64.zip --clobber
          fi

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libegl1 libdbus-1-3 libxkbcommon-x11-0
          python -m pip install --upgrade pip
          pip install PyQt5 requests qrcode pillow numpy pyinstaller
          python packaging/app/make_icon.py packaging/app brand
      - name: Build Linux standalone binary with PyInstaller
        run: |
          VERSION=$(python -c "import re;print(re.search(r'VERSION\s*=\s*\"([^\"]+)\"',open('bilifetch.py',encoding='utf-8').read()).group(1))")
          pyinstaller --noconfirm --onedir --windowed \
            --name BiliFetch \
            --add-data "packaging/app/icon_1024.png:." \
            --exclude-module numpy --exclude-module cryptography \
            --exclude-module matplotlib --exclude-module pandas --exclude-module scipy \
            bilifetch_gui.py
          cp README.md LICENSE dist/BiliFetch/
          tar -C dist -czf "dist/BiliFetch-${VERSION}-Linux-x64.tar.gz" BiliFetch
      - name: Upload Linux x64 Standalone Tarball to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" == v* ]]; then
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "BiliFetch $TAG" --generate-notes
            gh release upload "$TAG" dist/BiliFetch-*-Linux-x64.tar.gz --clobber
          fi
